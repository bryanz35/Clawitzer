[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32@6.10.0
board = nodemcu-32s
framework = espidf
monitor_speed = 115200
; Onboard USB-to-UART bridge; UART0 GPIO1/3 are reserved for host serial.
; Set -DDEBUG=1 for '#' prefixed state and input diagnostics.
build_flags =
    -std=gnu++17
    -DDEBUG=0

; The motion model and wire adapter have no ESP-IDF dependencies.
[env:native]
platform = native@1.2.1
test_build_src = yes
build_src_filter = +<protocol.cpp> +<arm.cpp> +<serial_controller.cpp> +<actuator_config.cpp> +<calibration_protocol.cpp> +<calibration_session.cpp>
build_flags = -std=c++17 -Wall -Wextra -Isrc
test_framework = unity
