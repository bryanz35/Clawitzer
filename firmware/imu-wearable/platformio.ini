[platformio]
default_envs = esp32-s3

; Copy include/secrets.example.h to include/secrets.h (gitignored) and fill in Wi-Fi credentials.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1 ; TODO(open-item): wearable board
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO08x
    links2004/WebSockets
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
